<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Tools | DENN. Private</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#181818;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,textarea{font:inherit}.page{width:min(980px,calc(100% - 48px));margin:auto;padding:64px 0 90px}
    .top,.hero,.item-head,.actions{display:flex;align-items:center;justify-content:space-between;gap:24px}.top{margin-bottom:100px}
    .logo{color:inherit;font-size:2rem;font-weight:800;letter-spacing:-2px;text-decoration:none}.back{color:#777;text-decoration:none}
    .hero{align-items:flex-end;margin-bottom:54px}h1{margin:0;font-size:clamp(4rem,8vw,6rem);line-height:.9;letter-spacing:-.07em}
    .subtitle{margin:24px 0 0;color:#777;font-size:1.05rem}.button{border:1px solid #181818;border-radius:999px;background:#181818;color:#fff;padding:11px 19px;text-decoration:none;cursor:pointer}
    #status{min-height:24px;margin-bottom:16px;color:#777}.list{border-top:1px solid #d8d8d3}.item{padding:25px 0;border-bottom:1px solid #d8d8d3}
    .item-title{font-size:1.25rem;font-weight:700}.item-url,.item-description{margin-top:6px;color:#888;font-size:.9rem}.item-buttons{display:flex;gap:9px}
    .small{border:1px solid #bbb;border-radius:999px;background:transparent;padding:7px 12px;cursor:pointer}.danger{color:#914444}
    dialog{width:min(620px,calc(100% - 32px));padding:0;border:1px solid #ccc;border-radius:20px;background:#f5f5f2}dialog::backdrop{background:rgba(0,0,0,.35)}
    form{padding:30px}.field{margin-bottom:20px}label{display:block;margin-bottom:7px;color:#777;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
    input[type=text],input[type=url],input[type=number],textarea{width:100%;padding:12px 14px;border:1px solid #ccc;border-radius:10px;background:#fff}textarea{min-height:90px;resize:vertical}
    .check{display:flex;align-items:center;gap:9px}.check label{margin:0}.actions{margin-top:28px}.secondary{background:transparent;color:#555;border-color:#aaa}
    @media(max-width:600px){.page{padding-top:38px}.top{margin-bottom:70px}.hero{align-items:flex-start;flex-direction:column}.item-head{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <main class="page">
    <header class="top"><a class="logo" href="/">DENN.</a><a class="back" href="/">← Dashboard</a></header>
    <section class="hero"><div><h1>Tools</h1><p class="subtitle">Manage the web apps shown on dennchan.com.</p></div><button class="button" id="new">+ New tool</button></section>
    <div id="status">Loading tools…</div><section class="list" id="list"></section>
  </main>
  <dialog id="dialog">
    <form id="form">
      <input type="hidden" id="id">
      <div class="field"><label for="name">Name</label><input id="name" type="text" required placeholder="NOW."></div>
      <div class="field"><label for="description">Description</label><textarea id="description"></textarea></div>
      <div class="field"><label for="url">App URL</label><input id="url" type="url" required placeholder="https://"></div>
      <div class="field"><label for="icon_url">Icon URL</label><input id="icon_url" type="url" placeholder="https://"></div>
      <div class="field"><label for="sort_order">Sort order</label><input id="sort_order" type="number" value="0"></div>
      <div class="field check"><input id="is_public" type="checkbox" checked><label for="is_public">Show publicly</label></div>
      <div class="actions"><button class="button secondary" type="button" id="cancel">Cancel</button><button class="button" type="submit">Save tool</button></div>
    </form>
  </dialog>
  <script>
    const API="/api/tools",list=document.querySelector("#list"),statusEl=document.querySelector("#status"),dialog=document.querySelector("#dialog"),form=document.querySelector("#form");
    const fallbackTools=[{id:"preview-now",name:"NOW.",description:"Live time, weather, SkyTrain and headlines.",url:"https://now.dennchan.com",icon_url:"https://now.dennchan.com/icons/icon-512.png",is_public:1,sort_order:0}];
    let tools=fallbackTools;
    const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
    async function load(){render();statusEl.textContent="Loading tools…";try{const response=await fetch(API);if(!response.ok)throw new Error();const data=await response.json();if(!data.success)throw new Error();tools=data.tools.length?data.tools:fallbackTools;render();statusEl.textContent=tools.length?`${tools.length} tool${tools.length===1?"":"s"}`:"No tools yet."}catch{tools=fallbackTools;render();statusEl.textContent="Preview mode · Publish DENN. Private to manage tools."}}
    function render(){list.innerHTML=tools.map(tool=>`<article class="item"><div class="item-head"><div><div class="item-title">${esc(tool.name)}${tool.is_public?"":" · Hidden"}</div><div class="item-description">${esc(tool.description)}</div><div class="item-url">${esc(tool.url)}</div></div>${tool.id==="preview-now"?"":`<div class="item-buttons"><button class="small" data-edit="${tool.id}">Edit</button><button class="small danger" data-delete="${tool.id}">Delete</button></div>`}</div></article>`).join("")}
    function open(tool={}){form.reset();document.querySelector("#id").value=tool.id||"";document.querySelector("#name").value=tool.name||"";document.querySelector("#description").value=tool.description||"";document.querySelector("#url").value=tool.url||"";document.querySelector("#icon_url").value=tool.icon_url||"";document.querySelector("#sort_order").value=tool.sort_order||0;document.querySelector("#is_public").checked=tool.id?Boolean(tool.is_public):true;dialog.showModal()}
    document.querySelector("#new").onclick=()=>open();document.querySelector("#cancel").onclick=()=>dialog.close();
    list.onclick=async event=>{const edit=event.target.dataset.edit,remove=event.target.dataset.delete;if(edit)open(tools.find(tool=>String(tool.id)===edit));if(remove&&confirm("Delete this tool?")){await fetch(`${API}?id=${encodeURIComponent(remove)}`,{method:"DELETE"});await load()}};
    form.onsubmit=async event=>{event.preventDefault();const id=document.querySelector("#id").value;const body={id,name:document.querySelector("#name").value,description:document.querySelector("#description").value,url:document.querySelector("#url").value,icon_url:document.querySelector("#icon_url").value,sort_order:document.querySelector("#sort_order").value,is_public:document.querySelector("#is_public").checked};const response=await fetch(API,{method:id?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const data=await response.json();if(!data.success){alert(data.error);return}dialog.close();await load()};
    load();
  </script>
</body>
</html>
