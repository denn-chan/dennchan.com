<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#000000">

  <title>NOW.</title>

  <link rel="stylesheet" href="/now/style.css">
</head>

<body>

<div class="screen">

  <main class="grid">

    <!-- TIME -->

    <section class="cell time-cell">

      <div class="eyebrow">
        VANCOUVER
      </div>

      <div class="time-wrap">

        <div id="clock" class="clock">
          --:--
        </div>

        <div id="date" class="date">
          —
        </div>

      </div>

    </section>


    <!-- WEATHER -->

    <section class="cell weather-cell">

      <div class="eyebrow">
        WEATHER
      </div>

      <div class="weather-wrap">

        <div id="temperature" class="temperature">
          --°
        </div>

        <div
          id="condition"
          class="condition"
        >
          —
        </div>

        <div class="weather-bottom">

          <span>
            FEELS
            <strong id="feels">—</strong>
          </span>

          <span>
            H
            <strong id="high">—</strong>
          </span>

          <span>
            L
            <strong id="low">—</strong>
          </span>

        </div>

      </div>

    </section>


    <!-- TRANSIT -->

    <section class="cell transit-cell">

      <div class="transit-top">

        <div>

          <div class="eyebrow">
            SKYTRAIN · EXPO LINE
          </div>

          <div class="station">
            PATTERSON
          </div>

        </div>

        <div
          id="transit-updated"
          class="updated"
        >
        </div>

      </div>


      <div class="platform-grid">

        <!-- P1 -->

        <div class="platform">

          <div class="platform-title">

            <span>
              PLATFORM 1
            </span>

            <span>
              WESTBOUND
            </span>

          </div>

          <div
            id="platform-1"
            class="arrivals"
          >

            <div class="arrival placeholder">
              <span>—</span>
              <span>—</span>
            </div>

            <div class="arrival placeholder">
              <span>—</span>
              <span>—</span>
            </div>

            <div class="arrival placeholder">
              <span>—</span>
              <span>—</span>
            </div>

            <div class="arrival placeholder">
              <span>—</span>
              <span>—</span>
            </div>

          </div>

        </div>


        <!-- P2 -->

        <div class="platform">

          <div class="platform-title">

            <span>
              PLATFORM 2
            </span>

            <span>
              EASTBOUND
            </span>

          </div>

          <div
            id="platform-2"
            class="arrivals"
          >

            <div class="arrival placeholder">
              <span>—</span>
              <span>—</span>
            </div>

            <div class="arrival placeholder">
              <span>—</span>
              <span>—</span>
            </div>

            <div class="arrival placeholder">
              <span>—</span>
              <span>—</span>
            </div>

            <div class="arrival placeholder">
              <span>—</span>
              <span>—</span>
            </div>

          </div>

        </div>

      </div>

    </section>


    <!-- NEWS -->

    <section class="cell news-cell">

      <div class="eyebrow">
        LATEST
      </div>

      <div
        id="news"
        class="news"
      >

        <div class="headline placeholder">
          <span>—</span>
          <span>Waiting for headlines</span>
        </div>

      </div>

    </section>

  </main>


  <!-- TICKER -->

  <footer class="ticker">

    <div
      id="ticker"
      class="ticker-track"
    >
      <span>
        NOW · VANCOUVER
      </span>
    </div>

  </footer>

</div>


<script src="/now/app.js"></script>

</body>
</html>
