<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Now — DENN.</title>
  <meta name="description" content="What's happening around Dennis right now.">

  <link rel="stylesheet" href="/now/style.css">
</head>

<body>

  <main class="page">

    <!-- HEADER -->
    <header class="header">
      <a href="/" class="brand">DENN.</a>

      <div class="location">
        VANCOUVER
      </div>
    </header>


    <!-- TIME -->
    <section class="time-section">

      <div id="clock" class="clock">
        --:--
      </div>

      <div id="date" class="date">
        —
      </div>

    </section>


    <!-- WEATHER -->
    <section class="section weather-section">

      <div class="section-label">
        WEATHER
      </div>

      <div class="weather-layout">

        <div id="temperature" class="temperature">
          --°
        </div>

        <div class="weather-details">

          <div id="weather-condition" class="weather-condition">
            Loading
          </div>

          <div class="weather-secondary">
            Feels like
            <span id="feels-like">--°</span>
          </div>

          <div class="weather-secondary">
            <span id="weather-high">--°</span>
            /
            <span id="weather-low">--°</span>
          </div>

        </div>

      </div>

    </section>


    <!-- TRANSIT -->
    <section class="section transit-section">

      <div class="section-heading">

        <div>
          <div class="section-label">
            SKYTRAIN
          </div>

          <h1 class="station-name" id="station-name">
            Patterson
          </h1>

          <div class="line-name">
            Expo Line
          </div>
        </div>

        <button
          id="station-button"
          class="station-button"
          type="button"
          aria-label="Change SkyTrain station"
        >
          CHANGE
        </button>

      </div>


      <div class="platform-grid">

        <!-- PLATFORM 1 -->

        <div class="platform">

          <div class="platform-header">
            <span>PLATFORM 1</span>
            <span class="platform-direction">
              TO WATERFRONT
            </span>
          </div>

          <div id="platform-1" class="train-list">

            <div class="train-row loading-row">
              <span>Loading arrivals</span>
              <span>—</span>
            </div>

          </div>

        </div>


        <!-- PLATFORM 2 -->

        <div class="platform">

          <div class="platform-header">
            <span>PLATFORM 2</span>
            <span class="platform-direction">
              EASTBOUND
            </span>
          </div>

          <div id="platform-2" class="train-list">

            <div class="train-row loading-row">
              <span>Loading arrivals</span>
              <span>—</span>
            </div>

          </div>

        </div>

      </div>


      <div id="transit-status" class="data-status"></div>

    </section>


    <!-- NEWS -->
    <section class="section news-section">

      <div class="section-label">
        LATEST
      </div>

      <div id="news-list" class="news-list">

        <div class="news-row">
          <span class="news-source">NEWS</span>
          <span>Loading headlines</span>
        </div>

      </div>

    </section>

  </main>


  <!-- NEWS TICKER -->
  <footer class="ticker">

    <div class="ticker-track" id="ticker-track">
      <span>LOADING LATEST NEWS</span>
    </div>

  </footer>


  <!-- STATION SELECTOR -->
  <div
    id="station-modal"
    class="modal"
    aria-hidden="true"
  >

    <div class="modal-backdrop"></div>

    <div
      class="station-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="station-dialog-title"
    >

      <div class="station-panel-header">

        <h2 id="station-dialog-title">
          Station
        </h2>

        <button
          id="station-close"
          class="close-button"
          type="button"
        >
          CLOSE
        </button>

      </div>

      <div id="station-list" class="station-list"></div>

    </div>

  </div>


  <script src="/now/app.js"></script>

</body>
</html>
