<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>NOW.</title>

  <link rel="stylesheet" href="/now/style.css">
</head>

<body>

  <main class="now">

    <!-- TOP BAR -->

    <header class="topbar">

      <div class="identity">
        DENN. / NOW
      </div>

      <div class="place">
        VANCOUVER
      </div>

    </header>


    <!-- MAIN INFORMATION -->

    <section class="main-grid">

      <!-- CLOCK -->

      <section class="clock-panel">

        <div class="label">
          LOCAL TIME
        </div>

        <div id="clock" class="clock">
          --:--
        </div>

        <div id="date" class="date">
          —
        </div>

      </section>


      <!-- WEATHER -->

      <section class="weather-panel">

        <div class="label">
          WEATHER
        </div>

        <div class="weather-content">

          <div id="temperature" class="temperature">
            --°
          </div>

          <div class="weather-meta">

            <div
              id="weather-condition"
              class="weather-condition"
            >
              Loading
            </div>

            <div class="weather-detail">
              FEELS
              <span id="feels-like">--°</span>
            </div>

            <div class="weather-detail">
              <span id="weather-high">H --°</span>
              <span class="weather-separator">/</span>
              <span id="weather-low">L --°</span>
            </div>

          </div>

        </div>

      </section>


      <!-- SKYTRAIN -->

      <section class="transit-panel">

        <div class="transit-heading">

          <div>

            <div class="label">
              SKYTRAIN
            </div>

            <div class="station-line">

              <h1 id="station-name">
                Patterson
              </h1>

              <span class="line-name">
                EXPO LINE
              </span>

            </div>

          </div>


          <button
            id="station-button"
            class="change-button"
            type="button"
          >
            CHANGE
          </button>

        </div>


        <div class="platforms">

          <!-- PLATFORM 1 -->

          <section class="platform">

            <div class="platform-heading">

              <span>
                PLATFORM 1
              </span>

              <span class="platform-note">
                WESTBOUND
              </span>

            </div>

            <div
              id="platform-1"
              class="train-list"
            >

              <div class="train-row muted">
                <span>Loading arrivals</span>
                <span>—</span>
              </div>

            </div>

          </section>


          <!-- PLATFORM 2 -->

          <section class="platform">

            <div class="platform-heading">

              <span>
                PLATFORM 2
              </span>

              <span class="platform-note">
                EASTBOUND
              </span>

            </div>

            <div
              id="platform-2"
              class="train-list"
            >

              <div class="train-row muted">
                <span>Loading arrivals</span>
                <span>—</span>
              </div>

            </div>

          </section>

        </div>


        <div
          id="transit-status"
          class="transit-status"
        ></div>

      </section>

    </section>


    <!-- NEWS -->

    <section class="news-panel">

      <div class="news-heading">

        <span class="label">
          LATEST
        </span>

        <span
          id="news-updated"
          class="news-updated"
        ></span>

      </div>


      <div
        id="news-list"
        class="news-list"
      >

        <div class="news-item">

          <span class="news-source">
            NEWS
          </span>

          <span class="news-title muted">
            Loading headlines
          </span>

        </div>

      </div>

    </section>

  </main>


  <!-- BOTTOM NEWS TICKER -->

  <footer class="ticker">

    <div
      id="ticker-track"
      class="ticker-track"
    >
      <span>LOADING LATEST NEWS</span>
    </div>

  </footer>


  <!-- STATION SELECTOR -->

  <div
    id="station-modal"
    class="station-modal"
    aria-hidden="true"
  >

    <button
      class="station-backdrop"
      type="button"
      aria-label="Close station selector"
    ></button>


    <section
      class="station-sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="station-title"
    >

      <div class="station-sheet-header">

        <div>

          <div class="label">
            SKYTRAIN
          </div>

          <h2 id="station-title">
            Choose station
          </h2>

        </div>


        <button
          id="station-close"
          class="change-button"
          type="button"
        >
          CLOSE
        </button>

      </div>


      <div
        id="station-list"
        class="station-list"
      ></div>

    </section>

  </div>


  <script src="/now/app.js"></script>

</body>
</html>
