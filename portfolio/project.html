<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Project | DENN.</title>
  <meta
    name="description"
    content="Project details by Dennis Chan."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f5f2;
      color: #181818;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
    }

    a {
      color: inherit;
    }

    /* ========================================
       PAGE
    ======================================== */

    .page {
      width: min(1100px, calc(100% - 64px));
      margin: 0 auto;
      padding: 64px 0 40px;
    }

    /* ========================================
       HEADER
    ======================================== */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .logo {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -2px;
      text-decoration: none;
    }

    .logo:hover {
      opacity: 0.65;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 42px;
      padding: 9px 18px;

      border: 1px solid #c8c8c3;
      border-radius: 999px;

      color: #777;
      text-decoration: none;
      font-size: 0.95rem;

      transition:
        background 0.18s ease,
        color 0.18s ease,
        border-color 0.18s ease;
    }

    .back-button:hover {
      background: #181818;
      border-color: #181818;
      color: #fff;
    }

    /* ========================================
       LOADING / ERROR
    ======================================== */

    .state {
      padding: 150px 0;
      color: #999;
      font-size: 1rem;
    }

    .state-title {
      margin: 0 0 14px;
      color: #181818;
      font-size: 2rem;
      letter-spacing: -0.04em;
    }

    .state a {
      display: inline-block;
      margin-top: 22px;
      color: #181818;
    }

    /* ========================================
       HERO
    ======================================== */

    .hero {
      padding: 120px 0 70px;
    }

    .eyebrow {
      margin: 0 0 28px;

      color: #8c8c87;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    .hero h1 {
      max-width: 900px;
      margin: 0;

      font-size: clamp(4.2rem, 8vw, 7rem);
      font-weight: 800;
      line-height: 0.92;
      letter-spacing: -0.075em;
    }

    .hero-intro {
      max-width: 900px;
      margin: 38px 0 0;

      color: #5f5f5b;
      font-size: 1.25rem;
      line-height: 1.6;
    }

    /* ========================================
       HERO META
    ======================================== */

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 34px;

      margin-top: 28px;

      color: #777;
      font-size: 0.92rem;
    }

    .hero-meta-item {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .hero-meta-label {
      color: #999;
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .hero-meta-value {
      color: #181818;
      font-weight: 700;
    }

    /* ========================================
       CONTENT
    ======================================== */

    .content {
      border-top: 1px solid #d8d8d3;
    }

    .detail-section {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      gap: 70px;

      padding: 64px 0;
      border-bottom: 1px solid #d8d8d3;
    }

    .detail-label {
      margin: 4px 0 0;

      color: #8c8c87;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .detail-body {
      max-width: 720px;
    }

    .detail-text {
      margin: 0;

      color: #444;
      font-size: 1.15rem;
      line-height: 1.75;
      white-space: pre-line;
    }

    /* ========================================
       TOOLS
    ======================================== */

    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .tool {
      padding: 9px 14px;

      border: 1px solid #cececa;
      border-radius: 999px;

      color: #555;
      font-size: 0.9rem;
    }

    /* ========================================
       HIGHLIGHTS
    ======================================== */

    .highlights {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .highlights li {
      position: relative;

      padding: 16px 0 16px 24px;
      border-bottom: 1px solid #e1e1dd;

      color: #444;
      font-size: 1.05rem;
      line-height: 1.65;
    }

    .highlights li:first-child {
      padding-top: 0;
    }

    .highlights li:last-child {
      border-bottom: 0;
    }

    .highlights li::before {
      content: "—";
      position: absolute;
      left: 0;
      color: #aaa;
    }

    /* ========================================
       LINKS
    ======================================== */

    .project-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .project-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 44px;
      padding: 10px 18px;

      border: 1px solid #222;
      border-radius: 999px;

      color: #222;
      text-decoration: none;
      font-size: 0.95rem;

      transition:
        background 0.18s ease,
        color 0.18s ease,
        transform 0.18s ease;
    }

    .project-link:hover {
      background: #181818;
      color: #fff;
      transform: translateY(-1px);
    }

    /* ========================================
       ALL PROJECTS
    ======================================== */

    .all-projects {
      padding: 65px 0 0;
    }

    .all-projects a {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      color: #555;
      text-decoration: none;
      font-size: 0.95rem;
    }

    .all-projects a:hover {
      color: #181818;
    }

    /* ========================================
       BOTTOM
    ======================================== */

    .bottom {
      margin-top: 85px;
      padding-top: 36px;
      border-top: 1px solid #d8d8d3;
    }

    .bottom-label {
      margin-bottom: 18px;

      color: #999;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .bottom-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 42px;
      padding: 9px 18px;

      border: 1px solid #222;
      border-radius: 999px;

      color: #222;
      text-decoration: none;
      font-size: 0.95rem;

      transition:
        background 0.18s ease,
        color 0.18s ease,
        transform 0.18s ease;
    }

    .button:hover {
      background: #181818;
      color: #fff;
      transform: translateY(-1px);
    }

    /* ========================================
       FOOTER
    ======================================== */

    footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;

      margin-top: 86px;
      padding-top: 22px;
      border-top: 1px solid #d8d8d3;

      color: #aaa;
      font-size: 0.82rem;
    }

    /* ========================================
       MOBILE
    ======================================== */

    @media (max-width: 700px) {

      .page {
        width: calc(100% - 48px);
        padding-top: 32px;
      }

      .logo {
        font-size: 1.7rem;
      }

      .back-button {
        min-height: 38px;
        padding: 7px 14px;
        font-size: 0.88rem;
      }

      .hero {
        padding: 82px 0 55px;
      }

      .hero h1 {
        font-size: clamp(3.4rem, 17vw, 5.2rem);
        line-height: 0.93;
      }

      .hero-intro {
        margin-top: 30px;
        font-size: 1.08rem;
      }

      .hero-meta {
        margin-top: 24px;
        gap: 10px 24px;
      }

      .detail-section {
        grid-template-columns: 1fr;
        gap: 25px;
        padding: 45px 0;
      }

      .detail-text {
        font-size: 1.05rem;
      }

      .all-projects {
        padding-top: 50px;
      }

      .bottom {
        margin-top: 65px;
      }

      footer {
        margin-top: 64px;
      }
    }
  </style>
</head>


<body>

  <main class="page">

    <!-- HEADER -->

    <header class="header">

      <a class="logo" href="/">
        DENN.
      </a>

      <a class="back-button" href="/portfolio/">
        ← Portfolio
      </a>

    </header>


    <!-- DYNAMIC CONTENT -->

    <div id="project">

      <div class="state">
        Loading project…
      </div>

    </div>


    <!-- KEEP EXPLORING -->

    <section class="bottom">

      <div class="bottom-label">
        Keep exploring
      </div>

      <nav class="bottom-links" aria-label="More pages">

        <a class="button" href="/about/">
          About
        </a>

        <a class="button" href="/cv/">
          CV
        </a>

        <a class="button" href="/portfolio/">
          Portfolio
        </a>

      </nav>

    </section>


    <!-- FOOTER -->

    <footer>
      <span>DENN. · 2026</span>
      <span>dennchan.com</span>
    </footer>

  </main>


  <script>

    const API_URL =
      "https://api.dennchan.com/cv/";

    const projectElement =
      document.getElementById("project");


    /* ========================================
       ESCAPE HTML
    ======================================== */

    function escapeHTML(value = "") {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    /* ========================================
       GET SLUG
    ======================================== */

    function getSlug() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const querySlug =
        params.get("slug");

      if (querySlug) {
        return querySlug
          .trim()
          .toLowerCase();
      }


      const parts =
        window.location.pathname
          .split("/")
          .filter(Boolean);


      if (
        parts.length >= 2 &&
        parts[0] === "portfolio" &&
        parts[1] !== "project.html"
      ) {
        return decodeURIComponent(
          parts[1]
        ).toLowerCase();
      }


      return "";
    }


    /* ========================================
       TOOLS
    ======================================== */

    function renderTools(value) {

      if (!value || !value.trim()) {
        return "";
      }


      const tools =
        value
          .split(/[·,]/)
          .map(tool => tool.trim())
          .filter(Boolean);


      if (!tools.length) {
        return "";
      }


      return `
        <section class="detail-section">

          <h2 class="detail-label">
            Tools
          </h2>

          <div class="detail-body">

            <div class="tools">

              ${tools.map(tool => `
                <span class="tool">
                  ${escapeHTML(tool)}
                </span>
              `).join("")}

            </div>

          </div>

        </section>
      `;
    }


    /* ========================================
       HIGHLIGHTS
    ======================================== */

    function renderHighlights(bullets) {

      if (
        !Array.isArray(bullets) ||
        bullets.length === 0
      ) {
        return "";
      }


      return `
        <section class="detail-section">

          <h2 class="detail-label">
            Highlights
          </h2>

          <div class="detail-body">

            <ul class="highlights">

              ${bullets.map(bullet => `
                <li>
                  ${escapeHTML(bullet.content)}
                </li>
              `).join("")}

            </ul>

          </div>

        </section>
      `;
    }


    /* ========================================
       LINKS
    ======================================== */

    function safeURL(value) {

      if (!value) {
        return "";
      }

      try {

        const url =
          new URL(value);

        if (
          url.protocol !== "http:" &&
          url.protocol !== "https:"
        ) {
          return "";
        }

        return url.href;

      } catch {

        return "";
      }
    }


    function renderLinks(project) {

      const projectURL =
        safeURL(project.project_url);

      const githubURL =
        safeURL(project.github_url);


      if (!projectURL && !githubURL) {
        return "";
      }


      return `
        <section class="detail-section">

          <h2 class="detail-label">
            Links
          </h2>

          <div class="detail-body">

            <div class="project-links">

              ${
                projectURL
                  ? `
                    <a
                      class="project-link"
                      href="${escapeHTML(projectURL)}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      Visit project ↗
                    </a>
                  `
                  : ""
              }

              ${
                githubURL
                  ? `
                    <a
                      class="project-link"
                      href="${escapeHTML(githubURL)}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      GitHub ↗
                    </a>
                  `
                  : ""
              }

            </div>

          </div>

        </section>
      `;
    }


    /* ========================================
       HERO META
    ======================================== */

    function renderMeta(project) {

      const items = [];


      if (project.status) {

        items.push(`
          <div class="hero-meta-item">

            <span class="hero-meta-label">
              Status
            </span>

            <strong class="hero-meta-value">
              ${escapeHTML(project.status)}
            </strong>

          </div>
        `);
      }


      if (
        project.start_date ||
        project.end_date
      ) {

        let date = "";


        if (
          project.start_date &&
          project.end_date
        ) {

          date =
            `${project.start_date} — ${project.end_date}`;

        }

        else if (project.start_date) {

          date =
            project.start_date;

        }

        else {

          date =
            project.end_date;

        }


        items.push(`
          <div class="hero-meta-item">

            <span class="hero-meta-label">
              Date
            </span>

            <strong class="hero-meta-value">
              ${escapeHTML(date)}
            </strong>

          </div>
        `);
      }


      if (!items.length) {
        return "";
      }


      return `
        <div class="hero-meta">
          ${items.join("")}
        </div>
      `;
    }


    /* ========================================
       TEXT SECTION
    ======================================== */

    function renderTextSection(
      label,
      content
    ) {

      if (
        !content ||
        !content.trim()
      ) {
        return "";
      }


      return `
        <section class="detail-section">

          <h2 class="detail-label">
            ${escapeHTML(label)}
          </h2>

          <div class="detail-body">

            <p class="detail-text">${escapeHTML(
              content
            )}</p>

          </div>

        </section>
      `;
    }


    /* ========================================
       RENDER PROJECT
    ======================================== */

    function renderProject(project) {

      const category =
        project.category ||
        "Project";


      const intro =
        project.overview ||
        project.description ||
        "";


      document.title =
        `${project.title} | DENN.`;


      const metaDescription =
        intro
          .replace(/\s+/g, " ")
          .trim()
          .slice(0, 155);


      if (metaDescription) {

        const description =
          document.querySelector(
            'meta[name="description"]'
          );

        if (description) {
          description.setAttribute(
            "content",
            metaDescription
          );
        }
      }


      projectElement.innerHTML = `

        <section class="hero">

          <p class="eyebrow">
            ${escapeHTML(category)}
          </p>

          <h1>
            ${escapeHTML(project.title)}
          </h1>

          ${
            intro
              ? `
                <p class="hero-intro">${escapeHTML(
                  intro
                )}</p>
              `
              : ""
          }

          ${renderMeta(project)}

        </section>


        <div class="content">

          ${renderTextSection(
            "Overview",
            project.overview
          )}

          ${renderTextSection(
            "Why I built it",
            project.why
          )}

          ${renderTools(
            project.tools
          )}

          ${renderHighlights(
            project.bullets
          )}

          ${renderLinks(
            project
          )}

        </div>


        <div class="all-projects">

          <a href="/portfolio/">
            ← All projects
          </a>

        </div>
      `;
    }


    /* ========================================
       ERROR
    ======================================== */

    function renderError(
      title,
      message
    ) {

      projectElement.innerHTML = `
        <div class="state">

          <h1 class="state-title">
            ${escapeHTML(title)}
          </h1>

          <div>
            ${escapeHTML(message)}
          </div>

          <a href="/portfolio/">
            ← Back to portfolio
          </a>

        </div>
      `;
    }


    /* ========================================
       LOAD
    ======================================== */

    async function loadProject() {

      const slug =
        getSlug();


      if (!slug) {

        renderError(
          "Project not found.",
          "No project was specified."
        );

        return;
      }


      try {

        const response =
          await fetch(API_URL, {
            method: "GET",
            headers: {
              "Accept": "application/json"
            }
          });


        if (!response.ok) {

          throw new Error(
            `API returned ${response.status}`
          );
        }


        const data =
          await response.json();


        if (!data.success) {

          throw new Error(
            data.error ||
            "API request failed"
          );
        }


        const project =
          Array.isArray(data.items)

            ? data.items.find(item =>

                item.type === "project" &&

                String(
                  item.slug || ""
                ).toLowerCase() === slug &&

                Number(
                  item.is_public
                ) === 1 &&

                Number(
                  item.show_portfolio
                ) === 1
              )

            : null;


        if (!project) {

          renderError(
            "Project not found.",
            "This project is unavailable or not public."
          );

          return;
        }


        renderProject(project);

      }

      catch (error) {

        console.error(
          "Project loading error:",
          error
        );


        renderError(
          "Temporarily unavailable.",
          "This project could not be loaded right now."
        );
      }
    }


    loadProject();

  </script>

</body>
</html>
