<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portfolio | DENN.</title>
  <meta
    name="description"
    content="Selected projects, systems and ideas by Dennis Chan."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

      background: #f5f5f2;
      color: #181818;
    }

    a {
      color: inherit;
    }

    /* ========================================
       PAGE
    ======================================== */

    .page {
      width: min(1100px, calc(100% - 64px));
      margin: 0 auto;
      padding: 64px 0 40px;
    }

    /* ========================================
       HEADER
    ======================================== */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -2px;
      text-decoration: none;
    }

    .logo:hover {
      opacity: 0.65;
    }

    .home-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 42px;
      padding: 9px 18px;

      border: 1px solid #c8c8c3;
      border-radius: 999px;

      color: #777;
      text-decoration: none;
      font-size: 0.95rem;

      transition:
        background 0.18s ease,
        color 0.18s ease,
        border-color 0.18s ease;
    }

    .home-button:hover {
      background: #181818;
      border-color: #181818;
      color: #fff;
    }

    /* ========================================
       HERO
    ======================================== */

    .hero {
      padding: 112px 0 118px;
    }

    .eyebrow {
      margin: 0 0 28px;

      color: #8c8c87;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    .hero h1 {
      max-width: 900px;
      margin: 0;

      font-size: clamp(4rem, 7.2vw, 6.5rem);
      font-weight: 800;
      line-height: 0.93;
      letter-spacing: -0.075em;
    }

    .hero-description {
      max-width: 650px;
      margin: 42px 0 0;

      color: #666;
      font-size: 1.2rem;
      line-height: 1.55;
    }

    /* ========================================
       SECTION
    ======================================== */

    .section-label {
      margin: 0 0 18px;

      color: #8c8c87;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .projects {
      border-top: 1px solid #d8d8d3;
    }

    /* ========================================
       PROJECT
    ======================================== */

    .project {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 32px;

      padding: 42px 0 44px;
      border-bottom: 1px solid #d8d8d3;
    }

    .project-number {
      padding-top: 3px;

      color: #aaa;
      font-size: 0.82rem;
      font-variant-numeric: tabular-nums;
    }

    .project-content {
      min-width: 0;
    }

    .project-type {
      margin: 0 0 14px;

      color: #999;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .project-title {
      margin: 0;

      font-size: 1.65rem;
      font-weight: 750;
      line-height: 1.1;
      letter-spacing: -0.035em;
    }

    .project-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 18px;

      margin-top: 12px;

      color: #999;
      font-size: 0.9rem;
    }

    .project-meta span {
      display: inline-flex;
      align-items: center;
    }

    .project-description {
      max-width: 760px;
      margin: 20px 0 0;

      color: #555;
      font-size: 1rem;
      line-height: 1.65;

      white-space: pre-line;
    }

    /* ========================================
       BULLETS
    ======================================== */

    .project-bullets {
      max-width: 760px;
      margin: 24px 0 0;
      padding: 0;
      list-style: none;
    }

    .project-bullets li {
      position: relative;
      margin: 9px 0;
      padding-left: 18px;

      color: #555;
      line-height: 1.55;
    }

    .project-bullets li::before {
      content: "—";
      position: absolute;
      left: 0;
      color: #aaa;
    }

    /* ========================================
       PROJECT LINK
    ======================================== */

    .project-link-wrap {
      margin-top: 28px;
    }

    .project-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      color: #181818;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;

      transition:
        opacity 0.18s ease,
        gap 0.18s ease;
    }

    .project-link:hover {
      gap: 12px;
      opacity: 0.6;
    }

    .project-link-arrow {
      display: inline-block;
      transition: transform 0.18s ease;
    }

    .project-link:hover .project-link-arrow {
      transform: translateX(2px);
    }

    /* ========================================
       EMPTY / ERROR
    ======================================== */

    .status {
      padding: 38px 0;
      border-bottom: 1px solid #d8d8d3;

      color: #999;
      font-size: 0.95rem;
    }

    /* ========================================
       BOTTOM NAV
    ======================================== */

    .bottom {
      margin-top: 78px;
      padding-top: 36px;
      border-top: 1px solid #d8d8d3;
    }

    .bottom-label {
      margin-bottom: 18px;

      color: #999;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .bottom-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 42px;
      padding: 9px 18px;

      border: 1px solid #222;
      border-radius: 999px;

      color: #222;
      text-decoration: none;
      font-size: 0.95rem;

      transition:
        background 0.18s ease,
        color 0.18s ease,
        transform 0.18s ease;
    }

    .button:hover {
      background: #181818;
      color: #fff;
      transform: translateY(-1px);
    }

    /* ========================================
       FOOTER
    ======================================== */

    footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;

      margin-top: 86px;
      padding-top: 22px;
      border-top: 1px solid #d8d8d3;

      color: #aaa;
      font-size: 0.82rem;
    }

    /* ========================================
       MOBILE
    ======================================== */

    @media (max-width: 700px) {

      .page {
        width: calc(100% - 48px);
        padding-top: 32px;
      }

      .logo {
        font-size: 1.7rem;
      }

      .home-button {
        min-height: 38px;
        padding: 7px 14px;
        font-size: 0.88rem;
      }

      .hero {
        padding: 82px 0 88px;
      }

      .eyebrow {
        margin-bottom: 22px;
      }

      .hero h1 {
        font-size: clamp(3.2rem, 15vw, 5rem);
        line-height: 0.94;
      }

      .hero-description {
        margin-top: 32px;
        font-size: 1.05rem;
      }

      .project {
        grid-template-columns: 1fr;
        gap: 14px;

        padding: 32px 0 36px;
      }

      .project-number {
        padding: 0;
      }

      .project-title {
        font-size: 1.5rem;
      }

      .project-description {
        font-size: 0.98rem;
      }

      .project-link-wrap {
        margin-top: 24px;
      }

      .bottom {
        margin-top: 60px;
      }

      footer {
        margin-top: 64px;
      }
    }

  </style>
</head>

<body>

  <main class="page">

    <!-- HEADER -->

    <header class="header">

      <a class="logo" href="/">
        DENN.
      </a>

      <a class="home-button" href="/">
        ← Home
      </a>

    </header>


    <!-- HERO -->

    <section class="hero">

      <p class="eyebrow">
        Portfolio
      </p>

      <h1>
        Things I've made,<br>
        improved, or explored.
      </h1>

      <p class="hero-description">
        A collection of projects, systems and ideas —
        some for work, some for curiosity.
      </p>

    </section>


    <!-- PROJECTS -->

    <section>

      <p class="section-label">
        Selected Work
      </p>

      <div
        id="projects"
        class="projects"
        aria-live="polite"
      >
        <div class="status">
          Loading selected work…
        </div>
      </div>

    </section>


    <!-- BOTTOM NAV -->

    <section class="bottom">

      <div class="bottom-label">
        Keep exploring
      </div>

      <nav
        class="bottom-links"
        aria-label="More pages"
      >

        <a class="button" href="/about/">
          About
        </a>

        <a class="button" href="/cv/">
          CV
        </a>

      </nav>

    </section>


    <!-- FOOTER -->

    <footer>
      <span>DENN. · 2026</span>
      <span>dennchan.com</span>
    </footer>

  </main>


  <script>

    const API_URL =
      "https://api.dennchan.com/cv/";

    const projectsElement =
      document.getElementById("projects");


    /* ========================================
       ESCAPE HTML
    ======================================== */

    function escapeHTML(value = "") {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    /* ========================================
       CLEAN VALUE
    ======================================== */

    function clean(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      return String(value).trim();
    }


    /* ========================================
       PROJECT TYPE
    ======================================== */

    function createProjectType(item) {

      /*
        New Project schema:
        category takes priority.

        Example:
        Personal Project

        Fallback:
        Project
      */

      const category = clean(item.category);

      if (category) {
        return category;
      }

      if (clean(item.type)) {
        return item.type;
      }

      return "Project";
    }


    /* ========================================
       PROJECT META
    ======================================== */

    function createMeta(item) {

      const parts = [];

      const status = clean(item.status);
      const tools = clean(item.tools);
      const subtitle = clean(item.subtitle);
      const location = clean(item.location);

      const start = clean(item.start_date);
      const end = clean(item.end_date);


      /*
        Status
      */

      if (status) {
        parts.push(status);
      }


      /*
        Existing CV-style metadata
      */

      if (subtitle) {
        parts.push(subtitle);
      }

      if (location) {
        parts.push(location);
      }


      /*
        Date
      */

      if (start || end) {

        let date = "";

        if (start && end) {
          date = `${start} — ${end}`;
        }

        else if (start) {
          date = start;
        }

        else {
          date = end;
        }

        parts.push(date);
      }


      /*
        Tools

        Private Editor currently stores this as:
        Cloudflare · GitHub · D1 · JavaScript

        So it can be rendered directly.
      */

      if (tools) {
        parts.push(tools);
      }


      if (!parts.length) {
        return "";
      }


      return `
        <div class="project-meta">

          ${parts
            .map(
              part => `
                <span>
                  ${escapeHTML(part)}
                </span>
              `
            )
            .join("")}

        </div>
      `;
    }


    /* ========================================
       BULLETS
    ======================================== */

    function createBullets(bullets) {

      if (
        !Array.isArray(bullets) ||
        bullets.length === 0
      ) {
        return "";
      }


      const validBullets =
        bullets.filter(
          bullet =>
            clean(bullet.content)
        );


      if (!validBullets.length) {
        return "";
      }


      return `
        <ul class="project-bullets">

          ${validBullets
            .map(
              bullet => `
                <li>
                  ${escapeHTML(
                    bullet.content
                  )}
                </li>
              `
            )
            .join("")}

        </ul>
      `;
    }


    /* ========================================
       PROJECT LINK
    ======================================== */

    function createProjectLink(item) {

      const slug = clean(item.slug);

      /*
        No slug = no detail page link.

        This prevents broken URLs for older
        portfolio items that do not yet have
        the new Project schema.
      */

      if (!slug) {
        return "";
      }


      const url =
        `/portfolio/${encodeURIComponent(slug)}/`;


      return `
        <div class="project-link-wrap">

          <a
            class="project-link"
            href="${url}"
            aria-label="View ${escapeHTML(
              item.title || "project"
            )}"
          >
            <span>View project</span>

            <span
              class="project-link-arrow"
              aria-hidden="true"
            >
              →
            </span>
          </a>

        </div>
      `;
    }


    /* ========================================
       PROJECT
    ======================================== */

    function createProject(item, index) {

      const number =
        String(index + 1)
          .padStart(2, "0");


      const type =
        createProjectType(item);


      return `
        <article class="project">

          <div class="project-number">
            ${number}
          </div>


          <div class="project-content">

            <p class="project-type">
              ${escapeHTML(type)}
            </p>


            <h2 class="project-title">
              ${escapeHTML(
                item.title || "Untitled"
              )}
            </h2>


            ${createMeta(item)}


            ${
              clean(item.description)
                ? `
                  <p class="project-description">${escapeHTML(
                    item.description
                  )}</p>
                `
                : ""
            }


            ${createBullets(item.bullets)}


            ${createProjectLink(item)}

          </div>

        </article>
      `;
    }


    /* ========================================
       LOAD PORTFOLIO
    ======================================== */

    async function loadPortfolio() {

      try {

        const response =
          await fetch(API_URL, {

            method: "GET",

            headers: {
              "Accept": "application/json"
            }

          });


        if (!response.ok) {

          throw new Error(
            `API returned ${response.status}`
          );

        }


        const data =
          await response.json();


        if (!data.success) {

          throw new Error(
            data.error ||
            "API request failed"
          );

        }


        /*
          IMPORTANT

          Portfolio decides what appears here
          using show_portfolio only.

          show_cv has no effect on this page.
        */

        const projects =
          Array.isArray(data.items)

            ? data.items

                .filter(
                  item =>
                    Number(
                      item.is_public ?? 1
                    ) === 1 &&
                    Number(
                      item.show_portfolio
                    ) === 1
                )

                .sort(
                  (a, b) =>

                    Number(
                      a.sort_order || 0
                    ) -

                    Number(
                      b.sort_order || 0
                    )
                )

            : [];


        if (!projects.length) {

          projectsElement.innerHTML = `
            <div class="status">
              No public projects yet.
            </div>
          `;

          return;
        }


        projectsElement.innerHTML =
          projects
            .map(createProject)
            .join("");

      }


      catch (error) {

        console.error(
          "Portfolio loading error:",
          error
        );


        projectsElement.innerHTML = `
          <div class="status">
            Selected work is temporarily unavailable.
          </div>
        `;

      }

    }


    /* ========================================
       START
    ======================================== */

    loadPortfolio();

  </script>

</body>
</html>
