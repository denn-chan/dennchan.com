<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DENN. | Dennis Chan</title>

  <meta
    name="description"
    content="Dennis Chan — welcome to my little corner of the internet."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;

      background: #f5f5f2;
      color: #181818;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* =========================
       Main Container
    ========================= */

    .container {
      width: 90%;
      max-width: 700px;
      padding: 64px 20px;
    }

    /* =========================
       Private Button
       Fixed to browser top-right
    ========================= */

    .private-link {
      position: fixed;
      top: 48px;
      right: 48px;
      z-index: 100;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 40px;
      padding: 8px 15px;

      border: 1px solid #bbb;
      border-radius: 999px;

      color: #666;
      text-decoration: none;

      font-size: 0.9rem;
      white-space: nowrap;

      transition:
        background 0.18s ease,
        color 0.18s ease,
        border-color 0.18s ease,
        transform 0.18s ease;
    }

    .private-link:visited {
      color: #666;
    }

    .private-link:hover {
      background: #181818;
      border-color: #181818;
      color: #fff;

      transform: translateY(-1px);
    }

    /* =========================
       Logo
    ========================= */

    .logo {
      display: inline-block;

      margin: 0 0 8px;

      font-size: 4rem;
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -4px;

      color: #181818;
      text-decoration: none;

      transition: opacity 0.18s ease;
    }

    .logo:visited {
      color: #181818;
    }

    .logo:hover {
      opacity: 0.7;
    }

    /* =========================
       Name
    ========================= */

    .name {
      margin-bottom: 46px;

      font-size: 1.2rem;
      color: #666;
    }

    /* =========================
       Introduction
    ========================= */

    .intro {
      max-width: 620px;
      margin-bottom: 46px;

      font-size: 1.8rem;
      line-height: 1.35;
      letter-spacing: -0.5px;
    }

    /* =========================
       Navigation
    ========================= */

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 48px;
      padding: 11px 20px;

      border: 1px solid #222;
      border-radius: 999px;

      color: #222;
      text-decoration: none;

      font-size: 1rem;

      transition:
        background 0.18s ease,
        color 0.18s ease,
        border-color 0.18s ease,
        transform 0.18s ease;
    }

    .button:visited {
      color: #222;
    }

    .button:hover {
      background: #181818;
      border-color: #181818;
      color: #fff;

      transform: translateY(-1px);
    }

    /* =========================
       Footer
    ========================= */

    footer {
      margin-top: 72px;

      color: #999;
      font-size: 0.85rem;
    }

    /* =========================
       Mobile
    ========================= */

    @media (max-width: 600px) {

      body {
        align-items: flex-start;
      }

      .container {
        width: 100%;

        padding:
          max(100px, 14vh)
          28px
          48px;
      }

      /* Private moves closer to edge */

      .private-link {
        top: 24px;
        right: 24px;

        min-height: 36px;
        padding: 7px 12px;

        font-size: 0.82rem;
      }

      .logo {
        font-size: 3.2rem;
        letter-spacing: -3px;
      }

      .name {
        margin-bottom: 38px;
      }

      .intro {
        margin-bottom: 38px;

        font-size: 1.45rem;
      }

      .links {
        gap: 10px;
      }

      .button {
        min-height: 46px;
        padding: 10px 18px;
      }

      footer {
        margin-top: 60px;
      }
    }

  </style>
</head>

<body>

  <!-- Private Site -->
  <a
    class="private-link"
    href="https://private.dennchan.com"
    aria-label="Open private site"
  >
    🔒 Private
  </a>


  <!-- Main Content -->
  <main class="container">

    <!-- Logo -->
    <a class="logo" href="/">
      DENN.
    </a>

    <!-- Name -->
    <div class="name">
      Dennis Chan
    </div>

    <!-- Introduction -->
    <div class="intro">
      Welcome to my little corner of the internet.
    </div>

    <!-- Navigation -->
    <nav class="links" aria-label="Main navigation">

      <a class="button" href="/about/">
        About
      </a>

      <a class="button" href="/cv/">
        CV
      </a>

      <a class="button" href="/portfolio/">
        Portfolio
      </a>

    </nav>

    <!-- Footer -->
    <footer>
      © 2026 Dennis Chan
    </footer>

  </main>

</body>
</html>
