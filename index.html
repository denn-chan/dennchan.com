<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DENN. | Dennis Chan</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f2;
      color: #181818;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 90%;
      max-width: 700px;
      padding: 60px 20px;
    }

    .logo {
      font-size: 4rem;
      font-weight: 800;
      letter-spacing: -4px;
      margin-bottom: 8px;
    }

    .name {
      font-size: 1.2rem;
      color: #666;
      margin-bottom: 45px;
    }

    .intro {
      font-size: 1.8rem;
      line-height: 1.35;
      max-width: 600px;
      margin-bottom: 45px;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .button {
      display: inline-block;
      padding: 12px 20px;
      border: 1px solid #222;
      border-radius: 100px;
      text-decoration: none;
      color: #222;
      transition: 0.2s;
    }

    .button:hover {
      background: #222;
      color: white;
    }

    .private {
      border-color: #aaa;
      color: #666;
    }

    footer {
      margin-top: 70px;
      color: #999;
      font-size: 0.85rem;
    }

    @media (max-width: 600px) {
      .logo {
        font-size: 3.2rem;
      }

      .intro {
        font-size: 1.45rem;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <a href="/" style="color: inherit; text-decoration: none;">DENN.</a>

    <div class="name">
      Dennis Chan
    </div>

    <div class="intro">
      Welcome to my little corner of the internet.
    </div>

    <div class="links">

      <a class="button" href="#">
        About
      </a>

      <a class="button" href="#">
        CV
      </a>

      <a class="button" href="#">
        Portfolio
      </a>

<a class="button private" href="https://private.dennchan.com">
  🔒 Private
</a>

    </div>

    <footer>
      © 2026 Dennis Chan
    </footer>

  </main>

</body>
</html>
